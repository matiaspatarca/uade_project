<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Premios · Votá</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
  body{font-family:Inter,system-ui,sans-serif}
  .fade{animation:fade .45s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .bar{transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-violet-100 text-slate-800">

<header class="px-4 pt-10 pb-6 text-center">
  <h1 class="text-3xl font-extrabold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">🏆 Los Premios</h1>
  <p id="sub" class="mt-2 text-slate-500"></p>
</header>
<main id="app" class="max-w-3xl mx-auto px-4 pb-16"></main>

<script>
// ============ CONFIGURACIÓN ============
const SUPABASE_URL      = "https://TU-PROYECTO.supabase.co";   // <<< PEGAR ACÁ
const SUPABASE_ANON_KEY = "TU-ANON-KEY";                       // <<< PEGAR ACÁ
// =======================================

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cats = [], noms = [], status = 'pending', results = {};
let step = -1, choices = {}, legajo = localStorage.getItem('legajo') || '';

async function load() {
  const [c, n, s] = await Promise.all([
    db.from('categories').select('*').order('id'), db.from('nominees').select('*').order('id'),
    db.from('settings').select('status').single()]);
  cats = (c.data || []).sort((a, b) => a.is_gold - b.is_gold || a.id - b.id);   // el Oro va al final
  noms = n.data || []; status = s.data?.status || 'pending';
  if (status === 'closed') { const r = await db.rpc('get_results'); results = {}; (r.data || []).forEach(x => results[x.nominee_id] = Number(x.votes)); }
  render();
}

const msg = (e, t, d) => `<div class="text-center bg-white rounded-3xl shadow-lg p-10 fade"><div class="text-6xl">${e}</div><h2 class="text-2xl font-extrabold mt-3">${t}</h2><p class="text-slate-500 mt-1">${d}</p></div>`;

function render() {
  const app = $('app');
  if (status === 'pending') { $('sub').textContent = 'Todavía no abrió la votación'; app.innerHTML = msg('⏳', 'Volvé en un ratito', 'Apenas abra la votación vas a poder elegir.'); }
  else if (status === 'closed') { $('sub').textContent = 'Se abren los sobres 🎬'; renderResults(); }
  else if (localStorage.getItem('voted')) { $('sub').textContent = '¡Gracias por participar!'; app.innerHTML = msg('🎉', '¡Votos registrados!', 'Los ganadores se revelan cuando cierre la votación.'); }
  else if (step < 0) {
    $('sub').textContent = 'Votá en cada categoría. Un voto por categoría.';
    app.innerHTML = `<form id="intro" class="bg-white rounded-3xl shadow-lg p-6 fade">
      <label class="font-semibold">Tu legajo</label>
      <input id="legajo" required minlength="3" maxlength="60" value="${esc(legajo)}" autocomplete="off" placeholder="Ej: 1234567" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <button class="mt-4 w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold active:scale-95 transition">Empezar (${cats.length} categorías)</button></form>`;
    $('intro').onsubmit = e => { e.preventDefault(); legajo = $('legajo').value.trim().toLowerCase(); localStorage.setItem('legajo', legajo); step = 0; render(); };
  } else renderStep();
}

function renderStep() {
  const c = cats[step], list = noms.filter(n => n.category_id === c.id), last = step === cats.length - 1;
  $('sub').textContent = `Categoría ${step + 1} de ${cats.length}`;
  $('app').innerHTML = `<h2 class="text-2xl font-extrabold text-center mb-4 fade ${c.is_gold ? 'text-amber-600' : ''}">${esc(c.name)}</h2>
    <div class="grid gap-4 sm:grid-cols-2">${list.map(n => `
      <button data-id="${n.id}" class="pick text-left bg-white rounded-3xl shadow overflow-hidden fade ring-4 transition ${choices[c.id] == n.id ? 'ring-indigo-500' : 'ring-transparent'}">
        ${n.image_url ? `<img src="${esc(n.image_url)}" alt="" loading="lazy" class="w-full h-36 object-cover bg-slate-200">` : ''}
        <div class="p-4"><h3 class="font-extrabold text-lg">${choices[c.id] == n.id ? '✅ ' : ''}${esc(n.name)}</h3>
        <p class="text-xs font-semibold text-indigo-600">${esc(n.members)}</p><p class="text-sm text-slate-600 mt-1">${esc(n.description)}</p></div></button>`).join('')}</div>
    <div class="flex gap-2 mt-6">
      ${step ? '<button id="back" class="flex-1 py-3 rounded-xl bg-white font-semibold shadow">Atrás</button>' : ''}
      <button id="next" class="flex-[2] py-3 rounded-xl bg-indigo-600 text-white font-bold active:scale-95 transition">${choices[c.id] ? (last ? 'Enviar votos' : 'Siguiente') : (last ? 'Enviar sin votar acá' : 'Saltear')}</button></div>`;
  document.querySelectorAll('.pick').forEach(b => b.onclick = () => { choices[c.id] = +b.dataset.id; renderStep(); });
  if ($('back')) $('back').onclick = () => { step--; renderStep(); };
  $('next').onclick = () => last ? submit() : (step++, renderStep());
}

async function submit() {
  $('next').disabled = true; $('next').textContent = 'Enviando…';
  const rows = Object.entries(choices).map(([c, n]) => ({ category_id: +c, nominee_id: n, voter: legajo }));
  const res = await Promise.all(rows.map(r => db.from('votes').insert(r)));
  const errs = res.map(r => r.error).filter(Boolean);
  if (errs.some(e => e.code === '42501')) { alert('La votación no está abierta.'); return load(); }
  if (errs.length === rows.length && rows.length && errs.every(e => e.code === '23505')) alert('¡Ya votaste con este legajo! Gracias 😉');
  else if (errs.some(e => e.code !== '23505')) { alert('No pudimos registrar algún voto. Probá de nuevo.'); return renderStep(); }
  localStorage.setItem('voted', '1'); confetti({ particleCount: 90, spread: 70, origin: { y: .7 } }); render();
}

// Resultados: cada categoría es un "sobre" que se revela con un toque
function renderResults() {
  $('app').innerHTML = `<div class="space-y-5">${cats.map(c => `
    <section class="bg-white rounded-3xl shadow-lg p-6 text-center fade">
      <h2 class="text-xl font-extrabold ${c.is_gold ? 'text-amber-600' : ''}">${esc(c.name)}</h2>
      <div id="cat${c.id}"><button data-id="${c.id}" class="reveal mt-4 px-6 py-3 rounded-xl ${c.is_gold ? 'bg-gradient-to-r from-amber-400 to-orange-500' : 'bg-indigo-600'} text-white font-bold active:scale-95 transition">🎬 Abrir sobre</button></div>
    </section>`).join('')}</div>`;
  document.querySelectorAll('.reveal').forEach(b => b.onclick = () => reveal(cats.find(c => c.id == b.dataset.id)));
}

function reveal(c) {
  const rank = noms.filter(n => n.category_id === c.id).map(n => ({ ...n, v: results[n.id] || 0 })).sort((a, b) => b.v - a.v);
  const total = rank.reduce((a, n) => a + n.v, 0) || 1, w = rank[0];
  $(`cat${c.id}`).innerHTML = w ? `<div class="fade text-left">
      <div class="text-center mt-3"><div class="text-5xl">🥇</div><p class="text-xs font-bold text-amber-600">GANADOR</p>
      ${w.image_url ? `<img src="${esc(w.image_url)}" class="w-full h-40 object-cover rounded-2xl mt-2" alt="">` : ''}
      <h3 class="text-2xl font-extrabold mt-2">${esc(w.name)}</h3><p class="text-slate-500 text-sm">${esc(w.members)}</p></div>
      <div class="mt-4 space-y-3">${rank.map((n, i) => `<div><div class="flex justify-between text-sm font-semibold"><span>${esc(n.name)}</span><span>${n.v} · ${Math.round(n.v / total * 100)}%</span></div>
        <div class="h-3 bg-slate-100 rounded-full overflow-hidden mt-1"><div class="bar h-full rounded-full ${i ? 'bg-indigo-300' : 'bg-gradient-to-r from-amber-400 to-orange-500'}" style="width:0" data-w="${n.v / total * 100}"></div></div></div>`).join('')}</div></div>` : '<p class="mt-3 text-slate-500">Sin nominados</p>';
  setTimeout(() => document.querySelectorAll('.bar').forEach(b => b.style.width = b.dataset.w + '%'), 50);
  confetti(c.is_gold ? { particleCount: 300, spread: 120, startVelocity: 55, origin: { y: .5 }, colors: ['#fbbf24', '#f59e0b', '#fff7ed'] } : { particleCount: 120, spread: 80, origin: { y: .6 } });
}

// Realtime: cuando se abre/cierra, todos los celulares se enteran al instante
db.channel('settings').on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, load).subscribe();
load();
</script>
</body>
</html>
